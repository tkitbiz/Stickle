# Install once per clone: uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: block-private-paths
        name: block private paths
        entry: uv run --locked python scripts/check_private_paths.py
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format --check
        language: system
        types_or: [python, pyi]
      - id: pyright
        name: pyright
        entry: uv run --locked pyright
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: pytest
        name: pytest
        entry: uv run --locked pytest -q
        language: system
        pass_filenames: false
        always_run: true
