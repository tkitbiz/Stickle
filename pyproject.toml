[project]
name = "stickle"
version = "0.0.1"
description = "Sticky notes for Windows, Linux and macOS that follow you through your own cloud storage."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "apsw-sqlite3mc>=3.53.4.0",
    "keyring>=25.7.0",
    "markdown-it-py>=4.2.0",
    "pynacl>=1.6",
    "pyside6-essentials>=6.11.2",
]

[project.scripts]
stickle = "stickle.__main__:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "PTH", "RUF"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
extraPaths = ["src", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = ["-ra", "--strict-markers"]

[dependency-groups]
dev = [
    "hypothesis>=6.168.1",
    "nuitka>=4.2.2",
    "pefile>=2024.8.26",
    "pre-commit>=4.6.2",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "ruff>=0.16.8",
]
