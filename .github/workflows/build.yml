name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync --locked
      - run: uv run python scripts/build.py
      - name: Check that nothing else needs installing
        run: uv run python scripts/check_bundle.py build/stickle.dist
      - name: Smoke test
        shell: pwsh
        run: |
          $version = & build\stickle.dist\stickle.exe --version | Out-String
          if ($version.Trim() -ne "Stickle $(uv run python -c 'import stickle; print(stickle.__version__)')") {
            throw "unexpected --version output: $version"
          }
          & build\stickle.dist\stickle.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "self-test failed" }
          $env:QT_QPA_PLATFORM = "offscreen"
          $app = Start-Process build\stickle.dist\stickle.exe -PassThru
          Start-Sleep -Seconds 5
          if ($app.HasExited) { throw "stickle.exe exited early with code $($app.ExitCode)" }
          Stop-Process -Id $app.Id
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build\stickle.dist\* -DestinationPath stickle-windows-${{ matrix.arch }}.zip
      # The same program with an empty-but-for-a-note stickle-data folder next to it:
      # unzipped, it keeps its settings and notes there (portable mode).
      - name: Portable package
        shell: pwsh
        run: |
          $data = "build\stickle.dist\stickle-data"
          New-Item -ItemType Directory $data | Out-Null
          Set-Content -Path "$data\README.txt" -Encoding utf8 -Value @(
            "Stickle keeps its settings and notes in this folder (portable mode)."
            "Keep it next to stickle.exe, and keep it when you move or copy Stickle:"
            "your notes are in here."
          )
          Compress-Archive -Path build\stickle.dist\* -DestinationPath stickle-windows-${{ matrix.arch }}-portable.zip
          Remove-Item -Recurse -Force $data
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $names = [IO.Compression.ZipFile]::OpenRead("$PWD\stickle-windows-${{ matrix.arch }}-portable.zip").Entries.FullName
          if (-not ($names -match '^stickle-data[\\/]README\.txt$')) { throw "no stickle-data folder in the portable zip" }
      - uses: actions/upload-artifact@v7
        with:
          name: stickle-windows-${{ matrix.arch }}
          path: |
            stickle-windows-${{ matrix.arch }}.zip
            stickle-windows-${{ matrix.arch }}-portable.zip
          if-no-files-found: error
      # The Store package, unsigned as the Store takes it, and a copy signed with
      # a test certificate so it can be tried out.
      - name: MSIX
        shell: pwsh
        run: uv run python scripts/package_msix.py --arch ${{ matrix.arch }} --sign
      - uses: actions/upload-artifact@v7
        with:
          name: stickle-windows-${{ matrix.arch }}-msix
          path: |
            build/msix/stickle-windows-${{ matrix.arch }}.msix
            build/msix/stickle-windows-${{ matrix.arch }}-test.msix
            build/msix/stickle-windows-${{ matrix.arch }}-test.cer
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    # glibc 2.34: the oldest glibc the Qt libraries support, so the widest reach.
    container: quay.io/pypa/manylinux_2_34_x86_64
    steps:
      - uses: actions/checkout@v7
      - run: sh scripts/build_linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: stickle-linux-x86_64
          path: build/Stickle-x86_64.AppImage
          if-no-files-found: error

  linux-check:
    needs: linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "debian:12-slim", "fedora:latest"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: stickle-linux-x86_64
          path: build
      - name: Run on a clean ${{ matrix.image }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          docker run --rm -v "$PWD:/src:ro" "${{ matrix.image }}" \
            sh /src/scripts/check_appimage.sh /src/build/Stickle-x86_64.AppImage "$version"

  release:
    # Only for version tags, and only after every build and check above passed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # The Store packages go to the Store, not here: the unsigned one does not
      # install, and the test certificate must not be trusted by anyone.
      - name: Leave out the Store packages
        run: rm -f dist/*.msix dist/*.cer && ls dist
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a suffix (v0.0.1-test.1) is a pre-release.
          flags=""
          notes="Built and checked by the Build workflow (run $GITHUB_RUN_ID). Verify downloads against SHA256SUMS.txt."
          case "$GITHUB_REF_NAME" in
            *-*)
              flags="--prerelease"
              notes="Preview build for trying Stickle out. It keeps notes on this computer only: there is no syncing or backup yet, and later versions may change how notes are stored.

          $notes"
              ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" $flags \
            --title "Stickle $GITHUB_REF_NAME" --notes "$notes"
