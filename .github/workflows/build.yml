name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync --locked
      - run: uv run python scripts/build.py
      - name: Check that nothing else needs installing
        run: uv run python scripts/check_bundle.py build/stickle.dist
      - name: Smoke test
        shell: pwsh
        run: |
          $version = & build\stickle.dist\stickle.exe --version | Out-String
          if ($version.Trim() -ne "Stickle $(uv run python -c 'import stickle; print(stickle.__version__)')") {
            throw "unexpected --version output: $version"
          }
          & build\stickle.dist\stickle.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "self-test failed" }
          $env:QT_QPA_PLATFORM = "offscreen"
          $app = Start-Process build\stickle.dist\stickle.exe -PassThru
          Start-Sleep -Seconds 5
          if ($app.HasExited) { throw "stickle.exe exited early with code $($app.ExitCode)" }
          Stop-Process -Id $app.Id
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build\stickle.dist\* -DestinationPath stickle-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: stickle-windows-x64
          path: stickle-windows-x64.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    # glibc 2.34: the oldest glibc the Qt libraries support, so the widest reach.
    container: quay.io/pypa/manylinux_2_34_x86_64
    steps:
      - uses: actions/checkout@v7
      - run: sh scripts/build_linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: stickle-linux-x86_64
          path: build/Stickle-x86_64.AppImage
          if-no-files-found: error

  linux-check:
    needs: linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "debian:12-slim", "fedora:latest"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: stickle-linux-x86_64
          path: build
      - name: Run on a clean ${{ matrix.image }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          docker run --rm -v "$PWD:/src:ro" "${{ matrix.image }}" \
            sh /src/scripts/check_appimage.sh /src/build/Stickle-x86_64.AppImage "$version"
